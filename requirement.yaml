# Conda environment for the HyperICM release.
#
# The codec and Hyperfree encoder are GPU-oriented. If CUDA 12.1 is not
# available, change/remove `pytorch-cuda=12.1` and install a matching
# PyTorch/torchvision pair for the local CUDA (or CPU) setup.
name: hypericm
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pytorch=2.1.*
  - torchvision=0.16.*
  - pytorch-cuda=12.1
  - numpy=1.26.*
  - pyyaml=6.*
  - rasterio=1.3.*
  - scikit-learn=1.3.*
  - tensorboard=2.15.*
  - tqdm=4.66.*
  - pip
  - pip:
      - "compressai==1.2.4"

# Optional Hyperfree utilities only:
#   pip install opencv-python pycocotools
# GDAL is optional and is not needed by train.py or inference.py.
